# Template config for `extract_msa_features.py` and `batch_extract_msa_features.py`
#
# Usage:
#   python extract_msa_features.py --config msa_feature_config.template.yaml
#   python batch_extract_msa_features.py --config msa_feature_config.template.yaml
#
# Precedence:
# 1. Explicit CLI arguments
# 2. Values from this YAML file
# 3. Built-in script defaults

# Single-file mode only:
audio_path: path/to/song.wav

# Batch mode only:
audio_dir: /home/emartinez/data/public/RWC-Music-Database/Popular-Music
limit: 100

# Shared output directory:
out_dir: feature_outputs/example_run

# Structure baseline mode:
#   python run_structure_baseline.py --config msa_feature_config.template.yaml
#
# If `feature_dir` is omitted or null, features are extracted online from
# `audio_dir` into `out_dir` before segmentation. If it is set, the runner
# reads *_features.npz files from that folder.
segmentation:
  feature_dir: feature_outputs/example_run
  experiment_dir: experiments/structure_baseline/example_run

  # One SSM feature is passed directly to every segmentation algorithm.
  # If more than one is listed, GraphDitty similarity network fusion is used
  # and the fused SSM is passed to every algorithm.
  ssm_features:
    - mfcc
    - cens
    - stm

  graphditty_fusion:
    k: 5
    niters: 20
    reg_diag: 1.0
    reg_neighbs: 0.5
    verbose: false

  # Supported SSM-based algorithms: "cbm", "as_seg_cbm", "msaf_cbm", "foote", "msaf_foote", "sf", "msaf_sf"
  # - cbm / as_seg_cbm: as-seg CBM, default source for CBM
  # - msaf_cbm: MSAF vendored CBM implementation
  # - foote / msaf_foote: MSAF Foote novelty over the selected SSM
  algorithms:
    - id: cbm
      source: as_seg
      run: True
      params:
        min_size: 1
        max_size: 32
        penalty_weight: 1.0
        penalty_func: modulo8
        bands_number:

    - id: foote
      source: msaf
      run: True
      params:
        M_gaussian: 66
        L_peaks: 64

    - id: scluster
      source: msaf
      run: True
      params:
        rep_feature: cens # global representation feature (must be one of the `computing_features` above!)
        loc_feature: mfcc # local representation feature (must be one of the `computing_features` above!)
        scluster_k: 4
        num_layers: 10
        evec_smooth: 9
        rec_smooth: 9
        rec_width: 9


feature_config:
  # Optional section annotation directory containing *.CHORUS.TXT files
  sections_dir: /home/emartinez/data/public/RWC-Music-Database/Popular-Music/CHORUS

  # Audio / feature extraction
  sr: 16000
  hop_length: 512

  # Beat tracking: librosa | beat_this | madmom
  beat_tracking_method: beat_this

  # SSL device
  ssl_device: "cpu"

  # Computing features
  # Available options:
  # - Classical audio features -
  #   stm, mfcc, chroma, cens, arrangement, vocal, bass, tonnetz, density, fused
  # - SSL models -
  #   muq, matpac, musicfm
  # - Sections (labels) -  
  #   sections

  computing_features:
    - stm
    - cens
    - chroma
    - mfcc
    - sections
    - matpac
    - muq
    - musicfm

  # Preview rendering
  # Available options:
  #   stm, mfcc, chroma, cens, arrangement, vocal, bass, tonnetz, density, sections, fused
  preview_features:
    - stm
    - cens
    - chroma
    - mfcc
    - sections
    - matpac
    - muq
    - musicfm


  # Output preview image formats
  preview_formats:
    - png
    - svg

  # STM parameters
  stm_coeffs: 400
  stm_window_s: 8.0
  stm_hop_s: 0.5
  stm_min_beats: 5
