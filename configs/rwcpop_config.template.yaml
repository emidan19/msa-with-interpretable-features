# Template config for `extract_msa_features.py` and `batch_extract_msa_features.py`
#
# Usage:
#   python extract_msa_features.py --config msa_feature_config.template.yaml
#   python batch_extract_msa_features.py --config msa_feature_config.template.yaml
#
# Precedence:
# 1. Explicit CLI arguments
# 2. Values from this YAML file
# 3. Built-in script defaults

# Single-file mode only:
audio_path: path/to/song.wav

# Batch mode only:
audio_dir: /home/emartinez/data/public/structure/RWC-Music-Database/Popular-Music
limit: 100

# Shared output directory:
out_dir: null

# Structure baseline mode:
#   python run_structure_baseline.py --config msa_feature_config.template.yaml
#
# If `feature_dir` is omitted or null, features are extracted online from
# `audio_dir` and used directly for segmentation. They are saved to `out_dir`
# only if `out_dir` is set; with `out_dir: null` nothing is written to disk.
# If `feature_dir` is set, the runner reads *_features.npz files from that folder.
segmentation:
  feature_dir: null
  experiment_dir: experiments/structure_baseline/rwc_segments

  # Every entry below is run and reported SEPARATELY (each algorithm is run
  # once per entry, writing results under
  # <experiment_dir>/<algorithm>__<run_label>/).
  #
  # - `ssm_features`: one run per single feature, no fusion between them.
  # - `graphditty_fusion.features` (optional, not set here): one additional
  #   run per inner list, fusing just those features with GraphDitty. Run
  #   label is `fused_<feat1>-<feat2>...`.
  ssm_features:
    - musicfm
    - repcl
    - muq
    - mfcc
    - chroma
    - stm
    - mule

  graphditty_fusion:
    features: null #[[stm, muq], [stm, musicfm]]
    k: 5
    niters: 20
    reg_diag: 1.0
    reg_neighbs: 0.5
    verbose: false

  # Supported SSM-based algorithms: "cbm", "as_seg_cbm", "msaf_cbm", "foote", "msaf_foote", "sf", "msaf_sf"
  # - cbm / as_seg_cbm: as-seg CBM, default source for CBM
  # - msaf_cbm: MSAF vendored CBM implementation
  # - foote / msaf_foote: MSAF Foote novelty over the selected SSM
  # - CBM is bar-wise: with `grid: bar` (default) the beat SSM is pooled into a
  #   bar SSM using the downbeats, CBM runs there, and its boundaries are mapped
  #   back to beats. `min_size`, `max_size` and the `modulo8` penalty are then
  #   in BARS (paper defaults: 1, 32, modulo8). `grid: beat` runs CBM on the
  #   beat SSM (sizes in beats); its output folder gets a `_beat` suffix.
  # - Optional `name:` per entry overrides the output folder prefix (needed to
  #   run the same algorithm twice with different params).
  algorithms:
    - id: cbm
      source: as_seg
      run: True
      params:
        grid: bar
        min_size: 1
        max_size: 32
        penalty_weight: 1.0
        penalty_func: modulo8
        bands_number:

    - id: foote
      source: msaf
      run: True
      params:
        M_gaussian: 66
        L_peaks: 64

    - id: scluster
      source: msaf
      run: True
      params:
        scluster_k: 4
        evec_smooth: 9
        rec_smooth: 1
        rec_width: 1


feature_config:
  # Optional section annotation directory containing *.CHORUS.TXT files
  sections_dir: /home/emartinez/data/public/structure/RWC-Music-Database/Popular-Music/CHORUS

  # Audio / feature extraction
  sr: 16000
  hop_length: 512

  # Beat tracking: librosa | beat_this | madmom
  beat_tracking_method: beat_this

  # SSL device
  ssl_device: "cuda"

  # Computing features
  # Available options:
  # - Classical audio features -
  #   stm, mfcc, chroma, cens, arrangement, vocal, bass, tonnetz, density
  # - SSL models -
  #   muq, matpac, musicfm, repcl, mule
  # - Sections (labels) -  
  #   sections

  computing_features:
    - stm
    - cens
    - chroma
    - mfcc
    - sections
    - muq
    - musicfm
    - repcl
    - mule

  # Preview rendering
  # Available options:
  #   stm, mfcc, chroma, cens, arrangement, vocal, bass, tonnetz, density, sections
  preview_features:
    - stm
    - cens
    - chroma
    - mfcc
    - sections
    - muq
    - musicfm
    - repcl
    - muq
    - mfcc
    - chroma
    - stm
    - mule
    - sections


  # Output preview image formats
  preview_formats:
    - png
    - svg

  # SSM similarity selection
  # Supported values: cosine, autocorrelation, covariance, rbf, centered_rbf
  ssm_similarity_type: rbf
  ssm_similarity_gamma: null

  # STM parameters
  stm_coeffs: 400
  stm_window_s: 8.0
  stm_hop_s: 0.5
  stm_min_beats: 5
