# Template config for `extract_msa_features.py` and `batch_extract_msa_features.py`
# pointed at the Harmonix dataset.
#
# Usage:
#   python extract_msa_features.py --config configs/harmonix_config.template.yaml
#   python batch_extract_msa_features.py --config configs/harmonix_config.template.yaml
#
# Precedence:
# 1. Explicit CLI arguments
# 2. Values from this YAML file
# 3. Built-in script defaults

# Single-file mode only:
audio_path: path/to/song.wav

# Batch mode only:
audio_dir: /home/emartinez/data/public/structure/harmonixset/dataset/harmonix_wav
limit: 10

# Shared output directory:
out_dir: feature_outputs/example_harmonix

# Structure baseline mode:
#   python run_structure_baseline.py --config configs/harmonix_config.template.yaml
#
# If `feature_dir` is omitted or null, features are extracted online from
# `audio_dir` into `out_dir` before segmentation. If it is set, the runner
# reads *_features.npz files from that folder.
segmentation:
  feature_dir: null
  experiment_dir: experiments/structure_baseline/example_harmonix2

  # Every entry below is run and reported SEPARATELY (each algorithm is run
  # once per entry, writing results under
  # <experiment_dir>/<algorithm>__<run_label>/).
  #
  # - `ssm_features`: one run per single feature, no fusion between them.
  # - `graphditty_fusion.features`: one additional run per inner list, each
  #   fusing just those features into one SSM with GraphDitty. Run label is
  #   `fused_<feat1>-<feat2>...`.
  ssm_features:
    - musicfm
    - repcl
    - muq
    - mfcc
    - chroma
    - stm

  graphditty_fusion:
    features: [[stm, repcl], [stm, musicfm], [stm, muq], [stm, mfcc], [stm, chroma]]
    k: 5
    niters: 20
    reg_diag: 1.0
    reg_neighbs: 0.5
    verbose: false

  # Supported SSM-based algorithms: "cbm", "as_seg_cbm", "msaf_cbm", "foote", "msaf_foote", "sf", "msaf_sf"
  # - cbm / as_seg_cbm: as-seg CBM, default source for CBM
  # - msaf_cbm: MSAF vendored CBM implementation
  # - foote / msaf_foote: MSAF Foote novelty over the selected SSM
  algorithms:
    - id: cbm
      source: as_seg
      run: True
      params:
        min_size: 1
        max_size: 32
        penalty_weight: 1.0
        penalty_func: modulo8
        bands_number:

    - id: foote
      source: msaf
      run: True
      params:
        M_gaussian: 66
        L_peaks: 64

    - id: scluster
      source: msaf
      run: False
      params:
        rep_feature: stm # global representation feature (must be one of the `computing_features` above!)
        loc_feature: stm # local representation feature (must be one of the `computing_features` above!)
        scluster_k: 4
        num_layers: 10
        evec_smooth: 9
        rec_smooth: 9
        rec_width: 9


feature_config:
  # Optional section annotation directory containing *.txt files, one per
  # audio_id (same stem as the .wav), with "start_seconds label" per line.
  sections_dir: /home/emartinez/data/public/structure/harmonixset/dataset/segments_valid

  # Label file naming/format: rwc_pop (*.CHORUS.TXT, tab-separated centiseconds)
  # or harmonix (*.txt, space-separated seconds, end = next row's start).
  label_format: harmonix

  # Audio / feature extraction
  sr: 16000
  hop_length: 512

  # Beat tracking: librosa | beat_this | madmom
  beat_tracking_method: beat_this

  # SSL device
  ssl_device: "cuda"

  # Computing features
  # Available options:
  # - Classical audio features -
  #   stm, mfcc, chroma, cens, arrangement, vocal, bass, tonnetz, density
  # - SSL models -
  #   muq, matpac, musicfm, repcl
  # - Sections (labels) -
  #   sections

  computing_features:
    - stm
    - cens
    - chroma
    - mfcc
    - sections
    - muq
    - musicfm
    - repcl

  # Preview rendering
  # Available options:
  #   stm, mfcc, chroma, cens, arrangement, vocal, bass, tonnetz, density, sections
  preview_features:
    - stm
    - cens
    - chroma
    - mfcc
    - sections
    - muq
    - musicfm
    - repcl


  # Output preview image formats
  preview_formats:
    - png
    - svg

  # SSM similarity selection
  # Supported values: cosine, autocorrelation, covariance, rbf, centered_rbf
  ssm_similarity_type: rbf
  ssm_similarity_gamma: null

  # STM parameters
  stm_coeffs: 400
  stm_window_s: 8.0
  stm_hop_s: 0.5
  stm_min_beats: 5
